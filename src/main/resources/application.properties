spring.application.name=notifyflow
spring.datasource.url = jdbc:postgresql://localhost:5435/notifyflow
spring.datasource.username=notifyflow
spring.datasource.password=${NOTIFYFLOW_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=25673
spring.rabbitmq.username=notifyflow
spring.rabbitmq.password=${NOTIFYFLOW_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=notifyflow
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false