services:
  backend:
    image: notifyflow-backend:local
    build:
      context: .

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifyflow
      NOTIFYFLOW_DB_PASSWORD: ${NOTIFYFLOW_DB_PASSWORD:?Set NOTIFYFLOW_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      NOTIFYFLOW_RABBITMQ_PASSWORD: ${NOTIFYFLOW_RABBITMQ_PASSWORD:?Set NOTIFYFLOW_RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: notifyflow-frontend:local
    build:
      context: ./frontend

    environment:
      ORIGIN: ${NOTIFYFLOW_PUBLIC_ORIGIN:-http://localhost:8088}
    depends_on:
      backend:
        condition: service_started

  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started