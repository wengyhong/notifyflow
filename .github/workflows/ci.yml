name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build backend container image
        run: docker build -t notifyflow-backend:ci .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build frontend container image
        run: docker build -t notifyflow-frontend:ci .
